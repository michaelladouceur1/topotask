[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "topotask"
version = "0.1.0"
description = "Composable DAG pipelines for robotics and simulation: Pydantic-validated YAML configs, a small threaded executor, and an optional FastAPI server."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "michaelladouceur", email = "michaelladouceur1@gmail.com" },
]
keywords = [
  "robotics",
  "simulation",
  "motion-planning",
  "pipeline",
  "dag",
  "workflow",
  "orchestration",
  "pydantic",
  "omegaconf",
  "fastapi",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.5",
  "omegaconf>=2.3",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx"]

[project.scripts]
topotask = "topotask.__main__:main"

# Third-party packages can ship nodes without touching core:
# [project.entry-points."topotask.nodes"]
# my_nodes = "my_pkg.nodes"

[project.urls]
Homepage = "https://github.com/michaelladouceur/topotask"
Repository = "https://github.com/michaelladouceur/topotask"
Issues = "https://github.com/michaelladouceur/topotask/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["topotask*"]

[tool.setuptools.package-data]
topotask = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/tests"]
pythonpath = ["."]
