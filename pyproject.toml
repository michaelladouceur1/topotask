[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "omegaconf>=2.3", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
gpu = ["warp-lang"]          # cuRobo is installed from source; see Dockerfile
dev = ["pytest", "httpx"]

# Third-party packages can ship nodes without touching core:
# [project.entry-points."topo.nodes"]
# my_nodes = "my_pkg.nodes"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
